<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0D2D1D">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Guide Course Preview | Never Fight or Argue Again</title>
<style>
:root{--g1:#0D2D1D;--g2:#1F4D31;--gold:#B8862A;--cream:#F7F4EC;--ink:#22302a;--line:#d9d0bc;--muted:#5a6a60;--side:300px;--chrome:0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#e8e2d3;color:var(--ink);font-family:Karla,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100%}
a{color:var(--g1)}
[hidden]{display:none!important}
.banner{flex:none;background:#5c3b00;color:#fff8e8;padding:.15rem .6rem;text-align:center;font-size:.7rem;line-height:1.2;letter-spacing:.02em}
.bar{flex:none;background:var(--g1);color:var(--cream);padding:.45rem .7rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar b{font-family:Marcellus,serif;font-weight:400;font-size:.98rem}
.bar .st{font-size:.75rem;color:#cfd8cc}
.bar .acts{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;cursor:pointer;background:var(--gold);color:var(--g1);font:700 .8rem Karla,sans-serif;padding:.45rem .7rem;border-radius:.45rem;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(247,244,236,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,summary:focus-visible,.secbtn:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{max-width:34rem;margin:1.5rem auto;background:#fff;border-radius:1rem;padding:1.2rem}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:var(--side) 1fr}
.side{background:#f3eee2;border-right:1px solid var(--line);min-height:0;overflow:auto;padding:.55rem .45rem .9rem}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.15rem .35rem .4rem}
.side-h h2{font-family:Marcellus,serif;font-weight:400;font-size:.95rem;margin:0}
.prog{padding:0 .35rem .35rem;font-size:.72rem;color:var(--muted)}
.progbar{height:5px;background:#ddd4c0;border-radius:999px;overflow:hidden;margin:0 .35rem .55rem}
.progbar>span{display:block;height:100%;width:0;background:var(--gold)}
details.chapter{border-radius:8px;margin:0 0 .25rem}
details.chapter[open]{background:rgba(255,255,255,.55)}
details.chapter>summary{list-style:none;cursor:pointer;display:flex;gap:.45rem;align-items:flex-start;padding:.55rem .5rem;border-radius:8px;font:700 .84rem Karla,sans-serif;color:var(--g1)}
details.chapter>summary::-webkit-details-marker{display:none}
details.chapter>summary .chev{flex:none;width:1rem;transition:transform .15s ease;transform:rotate(-90deg);color:var(--gold)}
details.chapter[open]>summary .chev{transform:rotate(0deg)}
details.chapter>summary .lab{flex:1;min-width:0}
details.chapter>summary .lab small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;margin-top:.1rem}
.sec-list{list-style:none;margin:0;padding:0 0 .35rem .35rem}
.sec-list li{margin:0}
.secbtn{width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:.4rem .5rem .4rem .7rem;cursor:pointer;font:500 .78rem Karla,sans-serif;color:#3a4a40;border-left:2px solid transparent}
.secbtn[aria-current="true"]{background:#fff;border-left-color:var(--gold);color:var(--g1);font-weight:700}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:#e8e2d3}
.crumbbar{flex:none;display:flex;gap:.5rem;align-items:center;padding:.45rem .65rem;background:#f7f2e6;border-bottom:1px solid var(--line)}
.iconbtn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:2.2rem;height:2.2rem;cursor:pointer;font-size:1.1rem;color:var(--g1);display:none}
.crumbs{flex:1;min-width:0;font-size:.78rem;color:var(--muted);line-height:1.3}
.crumbs strong{color:var(--g1);font-weight:700}
.stage-wrap{flex:1;min-height:0;overflow:auto;padding:.55rem .65rem .75rem}
.stage{max-width:720px;margin:0 auto}
#g .page{height:auto!important;min-height:0!important;overflow:visible!important;margin:0 auto;box-shadow:0 6px 20px rgba(13,45,29,.08);max-width:100%}
#g .chunk{padding:0}
.foot{flex:none;display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.5rem .65rem;background:#f3eee2;border-top:1px solid var(--line)}
.foot .loc{font-size:.78rem;color:var(--muted);text-align:center;flex:1;min-width:0}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(5,20,12,.45);z-index:40}
.drawer-backdrop.open{display:block}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:50;transform:translateX(-105%);transition:transform .2s ease;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  .side.open{transform:translateX(0)}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  details.chapter>summary .chev,.side{transition:none}
}
#g .chk{display:flex;gap:.55rem;align-items:center;margin-top:.7rem;font-weight:700;color:#1F4D31;font-size:1rem}
#g .chk input,#g .opt input{width:22px;height:22px;accent-color:#1F4D31}
#g .agree{margin:14px 0;padding:10px 14px;background:#fff;border:1px dashed #B8862A;border-radius:6px}
#g .sigtype{font-family:Marcellus,serif;font-size:17pt;margin:0 0 4px;border:0;border-bottom:1px solid #333;border-radius:0;background:transparent;padding:6px 2px}
#g .signs>div{font-size:8.5pt;letter-spacing:.2em;text-transform:uppercase}
#g textarea.fld{min-height:4.2em;font-size:16px;overflow:hidden}
#g input.fld{font-size:16px}
#g .signs.web{grid-template-columns:1fr 1fr 1fr}
@media (max-width:640px){#g .signs.web{grid-template-columns:1fr}}
@media print{.banner,.bar,.side,.crumbbar,.foot,.drawer-backdrop{display:none!important}body{background:#F7F4EC}#g .page{box-shadow:none}}
</style>
</head>
<body>
<div class="banner" role="status">Preview · answers not saved</div>
<div class="bar">
  <div><b>Companion Guide · Preview</b><div class="st" id="st" aria-live="polite">Opening…</div></div>
  <div class="acts">
    <a class="btn ghost" href="/members/library-preview/">Library</a>
    <button class="btn" id="pdf" type="button" disabled>Print</button>
  </div>
</div>
<div id="m" class="msg" hidden></div>
<div id="app" hidden>
  <div class="shell">
    <aside class="side" id="side" aria-label="Chapters">
      <div class="side-h"><h2>Chapters</h2><button type="button" class="btn ghost" id="sideClose" style="display:none;padding:.3rem .5rem;color:var(--g1);border-color:var(--line)">Close</button></div>
      <div class="prog" id="progText">Section 1 of 1</div>
      <div class="progbar" aria-hidden="true"><span id="progBar"></span></div>
      <nav id="sideNav"></nav>
    </aside>
    <div class="main">
      <div class="crumbbar">
        <button type="button" class="iconbtn" id="menuBtn" aria-label="Open chapter menu" aria-controls="side" aria-expanded="false">☰</button>
        <div class="crumbs" id="crumbs"></div>
      </div>
      <div class="stage-wrap" id="stageWrap">
        <div class="stage">
          <style id="gcss"></style>
          <div id="g"></div>
        </div>
      </div>
      <div class="foot">
        <button type="button" class="btn ghost" id="prev" style="background:var(--g1)">← Previous</button>
        <div class="loc" id="loc"></div>
        <button type="button" class="btn" id="next">Next →</button>
      </div>
    </div>
  </div>
</div>
<div class="drawer-backdrop" id="backdrop" hidden></div>
<script src="/assets/nfoa-auth.js"></script>
<script>
(function(){
var API=(window.NFOA_API||'https://zojsascliwlqgxcrqqlo.supabase.co/functions/v1')+'/guide';
var t=(new URLSearchParams(location.search).get('t')||'').toLowerCase();
var AUTH=null;
function hdr(h){h=h||{};if(AUTH)h.Authorization='Bearer '+AUTH;return h;}
function url(){return API+(t?'?t='+encodeURIComponent(t):'');}
var KEY='nfoa-guide-course-preview:'+(t||'me');
var st=document.getElementById('st'), G=document.getElementById('g');
var local={};try{local=JSON.parse(sessionStorage.getItem(KEY)||'{}')||{};}catch(e){}
var chapters=[]; // {label,title,sections:[{title,html}]}
var ci=0, si=0;
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fail(msg){document.getElementById('m').hidden=false;document.getElementById('m').textContent=msg;st.textContent='';document.getElementById('app').hidden=true;}
function group(id){var m=id.match(/^(w05-ch06-exercise-p1|w10-ch15-exercise-p\d)-(hurt|responsible|depends|r\d)$/);return m?m[1]:null;}
function grow(el){if(el.tagName==='TEXTAREA'){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}}
function val(el){return el.type==='checkbox'?(el.checked?'1':''):el.value;}
function set(el,v){if(el.type==='checkbox')el.checked=v==='1';else el.value=v;}
function put(id,v){local[id]=v;try{sessionStorage.setItem(KEY,JSON.stringify(local));}catch(e){}st.textContent='Preview — not saved to your account';}
function titleFrom(html){
  var m=html.match(/<h[1-4][^>]*>([\s\S]*?)<\/h[1-4]>/i);
  return m?m[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim():'Section';
}
function chunkSection(secHtml){
  var m=secHtml.trim().match(/^(<section\b[^>]*>)([\s\S]*)(<\/section\s*>)\s*$/i);
  if(!m) return [secHtml];
  var open=m[1], body=m[2], close=m[3];
  var bits=body.split(/(?=<h[34]\b)/i).filter(function(b){return b.trim();});
  if(bits.length<=1) return [secHtml];
  return bits.map(function(b,i){return open+'<div class="chunk" data-chunk="'+i+'">'+b+'</div>'+close;});
}
function buildChapters(html){
  var parts=html.split(/(?=<section\b)/i).filter(function(p){return /^<section\b/i.test(p.trim());});
  var out=[], cur=null, weekNo=0;
  parts.forEach(function(p){
    var am=p.match(/^<section\b([^>]*)>/i);
    var cls=((am&&am[1]||'').match(/class="([^"]*)"/)||[])[1]||'';
    if(/\bweek\b/.test(cls) && !/\bch\b/.test(cls)){
      if(cur) out.push(cur);
      weekNo+=1;
      var title=titleFrom(p);
      var label=weekNo<=12?('Chapter '+weekNo):'Toolkit';
      cur={label:label, title:title, sections:[{title:title, html:p}]};
      return;
    }
    if(!cur){cur={label:'Getting Started', title:'Getting Started', sections:[]};}
    chunkSection(p).forEach(function(ch){
      cur.sections.push({title:titleFrom(ch), html:ch});
    });
  });
  if(cur) out.push(cur);
  // Number sections within each chapter as Section 1, 2, ...
  out.forEach(function(ch){
    ch.sections.forEach(function(sec,i){
      sec.num=i+1;
      sec.navTitle='Section '+sec.num;
      sec.fullTitle=sec.title;
    });
  });
  return out;
}
function totalCount(){return chapters.reduce(function(n,c){return n+c.sections.length;},0);}
function absIndex(){
  var n=0;
  for(var i=0;i<chapters.length;i++){
    for(var j=0;j<chapters[i].sections.length;j++){
      n++; if(i===ci&&j===si) return n;
    }
  }
  return 1;
}
function progress(){
  var tot=totalCount(), abs=absIndex();
  document.getElementById('progText').textContent='Section '+abs+' of '+tot;
  document.getElementById('progBar').style.width=(tot?(abs/tot*100):0)+'%';
  var ch=chapters[ci], sec=ch.sections[si];
  document.getElementById('crumbs').innerHTML='<strong>'+esc(ch.label)+'</strong> · '+esc(ch.title)+'<br>Section '+sec.num+' — '+esc(sec.fullTitle);
  document.getElementById('loc').textContent=ch.label+' · Section '+sec.num+' / '+ch.sections.length;
  document.getElementById('prev').disabled=ci===0&&si===0;
  document.getElementById('next').disabled=ci===chapters.length-1&&si===ch.sections.length-1;
}
function paintSide(){
  var nav=document.getElementById('sideNav');
  nav.innerHTML=chapters.map(function(ch,i){
    var open=i===ci;
    var items=ch.sections.map(function(sec,j){
      return '<li><button type="button" class="secbtn" data-c="'+i+'" data-s="'+j+'" aria-current="'+(open&&j===si?'true':'false')+'">'+esc(sec.navTitle)+': '+esc(sec.fullTitle)+'</button></li>';
    }).join('');
    return '<details class="chapter" data-c="'+i+'" '+(open?'open':'')+'>'+
      '<summary><span class="chev" aria-hidden="true">▾</span><span class="lab">'+esc(ch.label)+'<small>'+esc(ch.title)+' · '+ch.sections.length+' sections</small></span></summary>'+
      '<ul class="sec-list">'+items+'</ul></details>';
  }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('.secbtn'),function(btn){
    btn.onclick=function(){go(+btn.getAttribute('data-c'), +btn.getAttribute('data-s')); closeDrawer();};
  });
  Array.prototype.forEach.call(nav.querySelectorAll('details.chapter'),function(d){
    d.addEventListener('toggle', function(){
      if(d.open){
        Array.prototype.forEach.call(nav.querySelectorAll('details.chapter'),function(o){if(o!==d) o.open=false;});
      }
    });
  });
}
function bindFields(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-field-id]'),function(el){
    var id=el.getAttribute('data-field-id');
    set(el, (id in local)?local[id]:'');
    setTimeout(function(){grow(el);},0);
    el.addEventListener(el.type==='checkbox'?'change':'input',function(){
      var g=group(id);
      if(g&&el.checked)Array.prototype.forEach.call(root.querySelectorAll('[data-field-id^="'+g+'-"]'),function(o){
        if(o!==el&&o.checked&&group(o.getAttribute('data-field-id'))===g){o.checked=false;put(o.getAttribute('data-field-id'),'');}
      });
      grow(el); put(id,val(el));
    });
  });
  ['w05-ch05-exercise-p2','w05-ch05-exercise-p3'].forEach(function(i){var e=document.getElementById(i);if(e)e.classList.add('merged');});
}
function go(c,s){
  if(c<0||c>=chapters.length) return;
  if(s<0){ if(c===0)return; c--; s=chapters[c].sections.length-1; }
  if(s>=chapters[c].sections.length){ if(c>=chapters.length-1)return; c++; s=0; }
  ci=c; si=s;
  G.innerHTML=chapters[ci].sections[si].html;
  bindFields(G);
  paintSide();
  progress();
  try{history.replaceState(null,'','#c'+ci+'-s'+si);}catch(e){}
  var wrap=document.getElementById('stageWrap');
  if(reduceMotion) wrap.scrollTop=0; else wrap.scrollTo({top:0,behavior:'smooth'});
}
function openDrawer(){
  document.getElementById('side').classList.add('open');
  var b=document.getElementById('backdrop'); b.hidden=false; b.classList.add('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded','true');
  document.getElementById('sideClose').style.display='inline-block';
}
function closeDrawer(){
  document.getElementById('side').classList.remove('open');
  var b=document.getElementById('backdrop'); b.classList.remove('open'); b.hidden=true;
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  document.getElementById('sideClose').style.display='none';
}
function start(){
  fetch(url(),{headers:hdr()}).then(function(r){return r.json();}).then(function(d){
    if(d.signed_out){location.href='/members/library-preview/';return;}
    if(!d.ok){fail((d.error||'This guide link is not valid.')+' Questions? Email hello@neverfightorargue.com.');return;}
    document.getElementById('gcss').textContent=d.guide.css+'\n#g .page{height:auto!important;min-height:0!important;overflow:visible!important;}';
    chapters=buildChapters(d.guide.html||'');
    if(!chapters.length){fail('Guide content could not be organized into chapters.');return;}
    document.getElementById('app').hidden=false;
    document.getElementById('pdf').disabled=false;
    document.getElementById('pdf').onclick=function(){window.print();};
    document.getElementById('prev').onclick=function(){if(si>0)go(ci,si-1);else if(ci>0)go(ci-1,chapters[ci-1].sections.length-1);};
    document.getElementById('next').onclick=function(){if(si<chapters[ci].sections.length-1)go(ci,si+1);else if(ci<chapters.length-1)go(ci+1,0);};
    document.getElementById('menuBtn').onclick=openDrawer;
    document.getElementById('sideClose').onclick=closeDrawer;
    document.getElementById('backdrop').onclick=closeDrawer;
    window.addEventListener('keydown',function(e){
      var tag=(e.target&&e.target.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable)) return;
      if(e.key==='Escape'){closeDrawer();return;}
      if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('prev').click();}
      if(e.key==='ArrowRight'){e.preventDefault();document.getElementById('next').click();}
    });
    var hash=location.hash.match(/^#c(\d+)-s(\d+)$/);
    var sc=hash?+hash[1]:0, ss=hash?+hash[2]:0;
    if(sc>=chapters.length)sc=0;
    if(!chapters[sc]||ss>=chapters[sc].sections.length)ss=0;
    go(sc,ss);
    st.textContent='Preview — answers stay on this device only';
  }).catch(function(){fail('Could not load the guide. Please check your connection and refresh.');});
}
if(t&&!/^[0-9a-f-]{36}$/.test(t)){fail('This guide link is not valid.');}
else if(t)start();
else NFOA_AUTH.session().then(function(s){
  if(!s){location.href='/members/library-preview/';return;}
  AUTH=s.access_token; start();
  setInterval(function(){NFOA_AUTH.session().then(function(x){if(x)AUTH=x.access_token;});},20*60000);
});
})();
</script>
</body>
</html>
